# Lance les tests automatiques d'Easy Route à chaque pull request et à chaque mise à jour de main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: rapport-tests
          path: playwright-report/
          retention-days: 7
